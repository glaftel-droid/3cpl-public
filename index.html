<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f1f5f9">
<title>3냉연 근무·수리 일정</title>
<style>
:root{color-scheme:light;--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;--brand:#4f46e5;--brand-soft:#eef2ff;--green:#047857;--green-soft:#ecfdf5;--amber:#b45309;--amber-soft:#fffbeb;--red:#be123c;--red-soft:#fff1f2;--blue:#1d4ed8;--blue-soft:#eff6ff;--shadow:0 8px 30px #0f172a0a}
:root.dark{color-scheme:dark;--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--muted:#94a3b8;--line:#334155;--soft:#172033;--brand:#818cf8;--brand-soft:#312e81;--green:#6ee7b7;--green-soft:#064e3b;--amber:#fcd34d;--amber-soft:#422006;--red:#fda4af;--red-soft:#4c0519;--blue:#93c5fd;--blue-soft:#172554;--shadow:0 8px 30px #0002}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.shell{width:min(100% - 20px,900px);margin:0 auto;padding:14px 0 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:6px 2px}
.title-wrap{min-width:0}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.09em;color:var(--brand);margin-bottom:3px}.title{font-size:22px;line-height:1.1;font-weight:950;letter-spacing:-.04em;margin:0}.subtitle{font-size:11px;color:var(--muted);margin:5px 0 0}.header-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}.snapshot-badge{font-size:10px;font-weight:800;color:var(--green);background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 25%,transparent);padding:6px 9px;border-radius:999px;white-space:nowrap}.icon-btn,.nav-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:800;cursor:pointer}
.icon-btn{width:34px;height:34px;font-size:15px}.main{display:grid;gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:11px;box-shadow:var(--shadow);min-width:0}.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 9px;padding:0 1px 8px;border-bottom:1px solid var(--line)}.section-title{font-size:14px;font-weight:900;margin:0;display:flex;align-items:center;gap:7px}.section-icon{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);font-size:13px}.nav{display:flex;align-items:center;gap:5px}.nav-btn{height:30px;min-width:31px;padding:0 8px;font-size:11px}.nav-btn.today{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 25%,var(--line))}.month-label{font-size:12px;font-weight:900;min-width:78px;text-align:center;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 7px;color:var(--muted);font-size:9px}.legend span{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;background:var(--soft);border:1px solid var(--line);border-radius:999px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.dot-day{background:#f59e0b}.dot-night{background:#6366f1}.dot-off{background:#94a3b8}.dot-cpl{background:#facc15}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday{text-align:center;font-size:9px;font-weight:900;color:var(--muted);padding:2px 0 4px}.weekday:first-child{color:#e11d48}.weekday:last-child{color:#2563eb}
.day{position:relative;min-width:0;min-height:91px;padding:4px 3px 3px;border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden}.day.out{opacity:.43;background:var(--soft)}.day.today{outline:2px solid var(--brand);outline-offset:-2px}.day.cpl{background:#fef9c3;border-color:#facc15}.dark .day.cpl{background:#422006;border-color:#a16207}.date-row{display:flex;justify-content:center;align-items:center;gap:3px;min-height:15px;margin-bottom:3px}.date{font-size:9px;font-weight:900;color:var(--muted);white-space:nowrap}.day.today .date{color:var(--brand)}.day.cpl .date{color:#854d0e}.dark .day.cpl .date{color:#fde68a}.geuk{font-size:7px;line-height:12px;padding:0 3px;border-radius:5px;color:#fff;background:#7c3aed;font-weight:900}.teams{display:grid;grid-template-columns:1fr 1fr;gap:2px}.team{display:block;text-align:center;font-size:8px;line-height:13px;border-radius:4px;font-weight:850;white-space:nowrap}.team.day-shift{color:#92400e;background:#fef3c7}.team.night-shift{color:#4338ca;background:#e0e7ff}.team.off-shift{color:#64748b;background:#f1f5f9}.dark .team.day-shift{color:#fde68a;background:#78350f}.dark .team.night-shift{color:#c7d2fe;background:#312e81}.dark .team.off-shift{color:#cbd5e1;background:#334155}.cpl-label{display:block;text-align:center;font-size:7px;font-weight:900;color:#854d0e;margin-top:2px;white-space:nowrap}.dark .cpl-label{color:#fde68a}.repair-markers{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;margin-top:2px}.repair-mini{font-size:7px;line-height:12px;padding:0 3px;border-radius:4px;font-weight:900;white-space:nowrap;color:#fff;background:#64748b}.repair-mini.cb{background:#4f46e5}.repair-mini.sd{background:#e11d48}.repair-mini.invest{background:#0f766e}.repair-mini.major{background:#c2410c}.repair-mini.other{background:#475569}
.summary{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 7px}.summary-pill{font-size:9px;font-weight:850;color:var(--muted);background:var(--soft);border:1px solid var(--line);padding:4px 7px;border-radius:999px}.facility{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:7px}.facility-head{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;background:var(--soft);font-size:11px;font-weight:900}.facility-name{display:flex;align-items:center;gap:6px}.facility-tag{padding:3px 7px;border-radius:7px;background:var(--blue-soft);color:var(--blue);font-size:9px}.facility-count{font-size:9px;color:var(--muted)}.repair-row{display:grid;grid-template-columns:68px 48px minmax(0,1fr) auto;align-items:center;gap:6px;padding:7px 8px;border-top:1px solid var(--line);font-size:10px}.repair-date{font-weight:900;white-space:nowrap}.repair-type{display:inline-block;text-align:center;padding:3px 5px;border-radius:6px;background:var(--soft);color:var(--ink);font-weight:900;white-space:nowrap}.repair-type.cb{background:#eef2ff;color:#4338ca}.repair-type.sd{background:#fff1f2;color:#be123c}.repair-type.invest{background:#ecfdf5;color:#047857}.repair-type.major{background:#fff7ed;color:#c2410c}.dark .repair-type.cb{background:#312e81;color:#c7d2fe}.dark .repair-type.sd{background:#4c0519;color:#fda4af}.dark .repair-type.invest{background:#064e3b;color:#6ee7b7}.dark .repair-type.major{background:#431407;color:#fdba74}.repair-detail{min-width:0;color:var(--muted);overflow-wrap:anywhere}.repair-status{font-size:8px;font-weight:900;white-space:nowrap;color:var(--green)}.repair-status.done{color:var(--muted)}.empty{padding:18px;text-align:center;color:var(--muted);font-size:11px}.updated{text-align:center;color:var(--muted);font-size:9px;padding:6px 0 0}.error{color:var(--red);background:var(--red-soft);border-radius:10px;padding:10px;font-size:11px}
@media(max-width:430px){.shell{width:calc(100% - 14px);padding-top:9px}.title{font-size:20px}.subtitle{font-size:10px}.snapshot-badge{font-size:9px;padding:5px 7px}.card{padding:8px;border-radius:14px}.card-head{margin-bottom:7px;padding-bottom:6px}.section-title{font-size:12px}.nav{gap:3px}.nav-btn{height:28px;min-width:27px;padding:0 6px;font-size:10px}.month-label{min-width:67px;font-size:11px}.day{min-height:79px;padding:3px 2px}.date{font-size:8px}.team{font-size:7px;line-height:12px}.cpl-label,.repair-mini{font-size:6.5px}.repair-row{grid-template-columns:61px 42px minmax(0,1fr) auto;gap:4px;padding:6px 6px;font-size:9px}}
@media(max-width:360px){.snapshot-badge{display:none}.day{min-height:73px}.repair-row{grid-template-columns:58px 40px minmax(0,1fr) auto}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="title-wrap">
      <div class="eyebrow">3CPL · PUBLIC SNAPSHOT</div>
      <h1 class="title">3냉연공장</h1>
      <p class="subtitle">교대근무표 · 3CPL · 공장 수리일정</p>
    </div>
    <div class="header-actions"><span class="snapshot-badge">공개 스냅샷</span><button class="icon-btn" id="themeBtn" type="button" aria-label="화면 테마 전환">☾</button></div>
  </header>
  <main class="main">
    <section class="card" aria-labelledby="shiftTitle">
      <div class="card-head">
        <h2 class="section-title" id="shiftTitle"><span class="section-icon">교</span>교대근무표</h2>
        <div class="nav"><button class="nav-btn" id="prevMonth" type="button" aria-label="이전 달">‹</button><span class="month-label" id="monthLabel">불러오는 중</span><button class="nav-btn" id="todayMonth" type="button">오늘</button><button class="nav-btn" id="nextMonth" type="button" aria-label="다음 달">›</button></div>
      </div>
      <div class="legend"><span><i class="dot dot-day"></i>주간</span><span><i class="dot dot-night"></i>야간</span><span><i class="dot dot-off"></i>휴무</span><span><i class="dot dot-cpl"></i>3CPL 출근</span><span>격 = 격주 휴무일</span></div>
      <div class="weekdays" aria-hidden="true"><div class="weekday">일</div><div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday">토</div></div>
      <div class="calendar" id="calendar" aria-live="polite"></div>
    </section>
    <section class="card" aria-labelledby="repairTitle">
      <div class="card-head"><h2 class="section-title" id="repairTitle"><span class="section-icon" style="background:var(--green-soft);color:var(--green)">수</span>공장 수리일정</h2><span class="facility-count" id="repairCount"></span></div>
      <div class="summary" id="summary"></div>
      <div id="repairs"><div class="empty">일정을 불러오는 중입니다.</div></div>
    </section>
  </main>
  <footer class="updated" id="updatedAt">자료를 불러오는 중…</footer>
</div>
<script>
'use strict';
const CYCLES={A:['주','주','휴','휴','야','야','휴','휴'],B:['휴','휴','주','주','휴','휴','야','야'],C:['휴','휴','야','야','휴','휴','주','주'],D:['야','야','휴','휴','주','주','휴','휴']};
const CYCLE_BASE=new Date(2026,8,30),CPL_BASE=new Date(2026,9,1),DAY_MS=86400000;
let snapshot={repairs:[],cpl_overrides:{}},snapshotLoaded=false,cursor=new Date();cursor.setDate(1);
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fromKey(s){const p=String(s||'').slice(0,10).split('-').map(Number);return p.length===3&&p.every(Number.isFinite)?new Date(p[0],p[1]-1,p[2]):null}
function dayDiff(a,b){return Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/DAY_MS)}
function cplWorks(d){const k=key(d),v=snapshot.cpl_overrides[k];if(v==='출')return true;if(v==='휴')return false;const n=dayDiff(d,CPL_BASE);return ((n%4)+4)%4>=2}
function typeClass(s){s=String(s||'').toUpperCase();if(s==='CB')return'cb';if(s==='SD')return'sd';if(s.includes('투자'))return'invest';if(s.includes('대수리')||s.includes('정기수리'))return'major';return'other'}
function repairDates(){const map=new Map();for(const r of snapshot.repairs){const a=fromKey(r.start_date),b=fromKey(r.end_date||r.start_date);if(!a||!b)continue;let d=new Date(a);for(let i=0;i<120&&d<=b;i++,d.setDate(d.getDate()+1)){const k=key(d);if(!map.has(k))map.set(k,[]);map.get(k).push(r)}}return map}
function appendText(parent,tag,text,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;parent.appendChild(e);return e}
function renderCalendar(){const cal=$('calendar');cal.replaceChildren();const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=key(new Date()),repByDate=repairDates();$('monthLabel').textContent=y+'년 '+(m+1)+'월';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),inMonth=d.getMonth()===m,diff=dayDiff(d,CYCLE_BASE),idx=((diff%8)+8)%8,items=repByDate.get(k)||[];const cell=document.createElement('div');cell.className='day'+(inMonth?'':' out')+(k===today?' today':'')+(cplWorks(d)?' cpl':'');cell.setAttribute('aria-label',k);const row=cell.appendChild(document.createElement('div'));row.className='date-row';appendText(row,'span',pad(d.getMonth()+1)+'/'+pad(d.getDate()),'date');if(inMonth&&(((diff-9)%14)+14)%14===0)appendText(row,'span','격','geuk');const teams=cell.appendChild(document.createElement('div'));teams.className='teams';for(const t of ['A','B','C','D']){const s=CYCLES[t][idx],cl=s==='주'?'day-shift':s==='야'?'night-shift':'off-shift';appendText(teams,'span',t+s,'team '+cl)}if(cplWorks(d))appendText(cell,'span','3CPL 출근','cpl-label');if(items.length){const marks=cell.appendChild(document.createElement('div'));marks.className='repair-markers';const labels=[...new Set(items.map(r=>String(r.repair_type||'수리').toUpperCase()))].slice(0,2);for(const label of labels){const chip=appendText(marks,'span',label,'repair-mini '+typeClass(label));chip.title=items.filter(r=>String(r.repair_type||'').toUpperCase()===label).map(r=>((r.facility||'')+' '+(r.content||'')).trim()).join(' · ')}}cal.appendChild(cell)} }
function renderRepairs(){const root=$('repairs');root.replaceChildren();const list=[...snapshot.repairs].sort((a,b)=>String(a.start_date).localeCompare(String(b.start_date))||String(a.facility).localeCompare(String(b.facility)));$('repairCount').textContent=list.length+'건';const totals=new Map();for(const r of list){const f=String(r.facility||'기타').toUpperCase();totals.set(f,(totals.get(f)||0)+1)}for(const [f,n] of [...totals.entries()].sort((a,b)=>['PCM','CAL'].indexOf(a[0])-['PCM','CAL'].indexOf(b[0]))){const group=document.createElement('div');group.className='facility';const head=group.appendChild(document.createElement('div'));head.className='facility-head';const left=head.appendChild(document.createElement('div'));left.className='facility-name';appendText(left,'span',f,'facility-tag');appendText(head,'span',n+'건','facility-count');for(const r of list.filter(x=>String(x.facility||'기타').toUpperCase()===f)){const row=group.appendChild(document.createElement('div'));row.className='repair-row';const start=fromKey(r.start_date),end=fromKey(r.end_date||r.start_date);let date=start?pad(start.getMonth()+1)+'/'+pad(start.getDate()):'날짜미정';if(end&&start&&key(end)!==key(start))date+='~'+pad(end.getMonth()+1)+'/'+pad(end.getDate());appendText(row,'span',date,'repair-date');appendText(row,'span',String(r.repair_type||'—'),'repair-type '+typeClass(r.repair_type));const detail=[String(r.content||'').trim(),String(r.facility||'').toUpperCase()].filter(Boolean).join(' · ');appendText(row,'span',detail,'repair-detail');const done=['done','completed','complete'].includes(String(r.status||'').toLowerCase());appendText(row,'span',done?'완료':'예정','repair-status'+(done?' done':''))}root.appendChild(group)}if(!list.length)root.appendChild(appendText(root,'div','등록된 일정이 없습니다.','empty'));$('summary').replaceChildren();for(const [f,n] of [...totals.entries()].sort((a,b)=>a[0].localeCompare(b[0])))appendText($('summary'),'span',f+' '+n+'건','summary-pill')}
function render(){renderCalendar();renderRepairs()}
$('prevMonth').addEventListener('click',()=>{cursor.setMonth(cursor.getMonth()-1);renderCalendar()});$('nextMonth').addEventListener('click',()=>{cursor.setMonth(cursor.getMonth()+1);renderCalendar()});$('todayMonth').addEventListener('click',()=>{cursor=new Date();cursor.setDate(1);renderCalendar()});
$('themeBtn').addEventListener('click',()=>{const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('3cpl-theme',d?'dark':'light')}catch(e){}$('themeBtn').textContent=d?'☀':'☾'});try{if(localStorage.getItem('3cpl-theme')==='dark'){document.documentElement.classList.add('dark');$('themeBtn').textContent='☀'}}catch(e){}
async function loadSnapshot(){try{const r=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.repairs)||!d.cpl_overrides||typeof d.cpl_overrides!=='object')throw new Error('자료 형식 오류');snapshot=d;render();snapshotLoaded=true;const t=new Date(d.updated_at);$('updatedAt').textContent='스냅샷 갱신: '+(Number.isNaN(t.getTime())?'시각 미상':new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Seoul'}).format(t)+' KST')+' · GitHub 자동 갱신은 하루 1회'}catch(e){if(snapshotLoaded){$('updatedAt').textContent='자동 갱신에 실패했습니다. 이전 스냅샷을 표시합니다.';return}const msg=document.createElement('div');msg.className='error';msg.textContent='자료를 불러오지 못했습니다. data.json과 GitHub Pages 설정을 확인하세요.';$('calendar').replaceChildren(msg.cloneNode(true));$('repairs').replaceChildren(msg);$('updatedAt').textContent='갱신 실패: '+e.message}}loadSnapshot();setInterval(loadSnapshot,15*60*1000);
</script>
</body>
</html>
